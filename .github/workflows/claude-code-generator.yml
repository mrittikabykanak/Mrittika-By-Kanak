name: Claude Code Generator

on:
  issues:
    types: [opened, edited]

jobs:
  generate-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic requests
      
      - name: Generate code with Claude
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/claude_generator.py
      
      - name: Create Pull Request
        if: steps.claude.outputs.code_generated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "feat: ${{ github.event.issue.title }}"
          title: "Auto-generated: ${{ github.event.issue.title }}"
          body: |
            ## Generated by Claude AI
            
            **Issue:** #${{ github.event.issue.number }}
            
            **Changes:**
            ${{ steps.claude.outputs.changes_summary }}
            
            Please review the generated code and merge if satisfied.
          branch: claude/issue-${{ github.event.issue.number }}
      
      - name: Comment on issue
        if: steps.claude.outputs.code_generated == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Claude has generated code for this request! Check the Pull Request created.'
            })
